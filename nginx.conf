server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Reverse proxy opcional hacia Prospector Externo (:8000)
    location /api/externo/ {
        proxy_pass http://prospector-externo:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Reverse proxy opcional hacia Prospector Interno (:8001)
    location /api/interno/ {
        proxy_pass http://prospector-interno:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # Enrutamiento SPA de Angular 22
    location / {
        try_files $uri $uri/ /index.html;
    }
}
